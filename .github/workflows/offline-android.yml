name: Build Moscow Oblast Offline APK
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "范围 minLon,minLat,maxLon,maxLat（默认莫斯科州）"
        default: "34.85,54.25,40.25,57.05"
      maxzoom:
        description: "最大级别（14 已含街道与建筑；13 可明显减小体积）"
        default: "14"
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:names
      - run: npm run test:nav
      - name: 截取莫斯科州地图数据 + 生成汉语搜索索引
        env:
          BBOX: ${{ inputs.bbox || '34.85,54.25,40.25,57.05' }}
          MAXZOOM: ${{ inputs.maxzoom || '14' }}
        run: bash scripts/build-data.sh
      - name: 生成离线导航数据（步行路网 + 地铁；失败时只是没有导航，地图 APK 照常构建）
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          bash scripts/build-nav.sh
      - run: npx cap add android
      - name: 允许定位（导航需要）
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>|' android/app/src/main/AndroidManifest.xml
          grep -n "LOCATION" android/app/src/main/AndroidManifest.xml
      - run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RussiaCNMap-Moscow-Oblast-Offline
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: 发布到 Releases（无需登录即可下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RussiaCNMap-Moscow.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest RussiaCNMap-Moscow.apk \
            --title "最新离线 APK（莫斯科州）" \
            --notes "由 ${GITHUB_SHA::7} 构建。直接下载 RussiaCNMap-Moscow.apk 安装即可。" \
            --target "$GITHUB_SHA"
