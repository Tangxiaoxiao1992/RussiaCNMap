name: Build Moscow Offline APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Download PMTiles CLI
        run: |
          curl -L https://github.com/protomaps/go-pmtiles/releases/download/v1.28.0/go-pmtiles_1.28.0_Linux_x86_64.tar.gz -o pmtiles.tar.gz
          tar -xzf pmtiles.tar.gz
          chmod +x pmtiles
      - name: Extract Moscow offline map
        run: |
          mkdir -p public
          DATE=$(date -u -d "2 days ago" +%Y%m%d)
          ./pmtiles extract "https://build.protomaps.com/${DATE}.pmtiles" public/moscow.pmtiles --bbox=37.30,55.55,37.90,55.95 --maxzoom=15
          ls -lh public/moscow.pmtiles
      - run: npx cap add android
      - run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RussiaCNMap-Moscow-Offline
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
